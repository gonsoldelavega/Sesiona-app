<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sesiona</title>
  <meta name="description" content="Sesiona: agenda, facturación, cobros y gestoría para consultas profesionales.">
  <meta name="theme-color" content="#315f73">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sesiona">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/advisor.css">
  <link rel="stylesheet" href="assets/css/invoice.css">
  <link rel="stylesheet" href="assets/css/calendar.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <div class="brand">Sesiona <span></span></div>
        <div id="todayLine" class="todayLine"></div>
      </div>
      <button class="topBtn" data-view="advisor">Gestoría</button>
    </header>
    <main id="screen" class="screen"></main>
    <button id="fab" class="fab">+</button>
    <nav class="bottom">
      <button data-view="agenda"><span>📅</span>Agenda</button>
      <button data-view="clients"><span>👤</span>Clientes</button>
      <button data-view="invoices"><span>◫</span>Facturas</button>
      <button data-view="advisor"><span>▣</span>Gestoría</button>
      <button data-view="more"><span>•••</span>Más</button>
    </nav>
  </div>
  <div id="sheet" class="sheet">
    <div class="sheetCard">
      <h2>Crear rápido</h2>
      <div class="sheetGrid">
        <button data-new="session"><b>Cita</b><small>Agenda y factura</small></button>
        <button data-new="photo"><b>Foto agenda</b><small>Sincroniza desde una foto</small></button>
        <button data-new="client"><b>Cliente</b><small>Precio, fiscalidad y WhatsApp</small></button>
        <button data-new="invoice"><b>Factura</b><small>Manual</small></button>
        <button data-new="expense"><b>Gasto</b><small>Justificante y deducción</small></button>
      </div>
    </div>
  </div>
  <dialog id="dlg"><div id="modal" class="modal"></div></dialog>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/advisor.js"></script>
  <script src="assets/js/branding.js"></script>
  <script src="assets/js/invoice.js"></script>
  <script src="assets/js/photo-import.js"></script>
  <script src="assets/js/cloud.js"></script>
  <script>
    window.addEventListener('load', function(){
      try {
        var pro = (window.S && S.set && (S.set.pro || '')) || '';
        if (pro === 'Profesional') pro = '';
        var name = String(pro).toUpperCase().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        document.title = 'Sesiona';
        document.querySelectorAll('.brand').forEach(function(el){ el.innerHTML = 'Sesiona <span>'+name+'</span>'; });
      } catch(e) {}
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); });
    }
  </script>
</body>
</html>
